name: Release

# Builds the signed StudyNotes APK and publishes a GitHub release whenever a tag like v1.2.3 is
# pushed. Installed apps check the latest release on start and must update to it.
#
# Repository secrets:
#   RELEASE_KEYSTORE_BASE64   studynotes-release.jks, base64-encoded (base64 -w0 studynotes-release.jks)
#   RELEASE_STORE_PASSWORD    its store password
#   RELEASE_KEY_ALIAS         the key alias
#   RELEASE_KEY_PASSWORD      the key password
#   STUDYNOTES_UPDATE_TOKEN   fine-grained token, Contents: read-only, this repository only; the app
#                             uses it to read releases while the repository is private
#
# Android only installs an update over an existing install when it is signed with the same key, so
# a release built without the keystore is refused here rather than shipped.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (major.minor.patch); the release is only published for tags'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="${{ github.event.inputs.version }}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be major.minor.patch, got '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Release signing secrets are missing; see the comment at the top of this workflow." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > studynotes-release.jks
          {
            echo "storeFile=studynotes-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest -PappVersion=${{ steps.version.outputs.version }}

      - name: Build the signed release APK
        env:
          STUDYNOTES_UPDATE_TOKEN: ${{ secrets.STUDYNOTES_UPDATE_TOKEN }}
        run: |
          if [[ -z "$STUDYNOTES_UPDATE_TOKEN" ]]; then
            echo "STUDYNOTES_UPDATE_TOKEN is missing: the app could not check for updates." >&2
            exit 1
          fi
          ./gradlew --no-daemon assembleRelease -PappVersion=${{ steps.version.outputs.version }}
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/StudyNotes-${{ steps.version.outputs.version }}.apk"
          (cd out && sha256sum "StudyNotes-${{ steps.version.outputs.version }}.apk" > "StudyNotes-${{ steps.version.outputs.version }}.apk.sha256")
          ls -l out

      - name: Remove the keystore
        if: always()
        run: rm -f studynotes-release.jks keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: StudyNotes-${{ steps.version.outputs.version }}
          path: out/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: StudyNotes ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            out/StudyNotes-${{ steps.version.outputs.version }}.apk
            out/StudyNotes-${{ steps.version.outputs.version }}.apk.sha256
